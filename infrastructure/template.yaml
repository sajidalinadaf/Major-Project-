AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: |
  OmniShelf — B2B Smart Expiry & Inventory Management Platform
  Provisions: DynamoDB tables, API Gateway, Lambda functions,
  IAM roles (Textract, Bedrock, SNS), and an EventBridge daily alert trigger.

# ────────────────────────────────────────────────────────────────────────────
# Parameters
# ────────────────────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  AlertEmailAddress:
    Type: String
    Default: manager@example.com
    Description: Email address to receive expiry alerts via SNS

  AlertThresholdDays:
    Type: Number
    Default: 7
    Description: Days before expiry to trigger an alert

  StoreName:
    Type: String
    Default: OmniShelf Store
    Description: Human-readable store name used in alert messages

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Amazon Bedrock model ID for AI extraction

  BedrockFallbackModelId:
    Type: String
    Default: amazon.titan-text-express-v1
    Description: Fallback Bedrock model if primary is unavailable

# ────────────────────────────────────────────────────────────────────────────
# Globals
# ────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]           # Graviton2 — cheaper + faster for Python
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT:     !Ref Environment
        INVENTORY_TABLE: !Ref OmniShelfInventory
        AUDIT_TABLE:     !Ref OmniShelfAudit
        SNS_TOPIC_ARN:   !Ref ExpiryAlertTopic
        STORE_NAME:      !Ref StoreName
    Tags:
      Project:     OmniShelf
      Environment: !Ref Environment

# ────────────────────────────────────────────────────────────────────────────
# Resources
# ────────────────────────────────────────────────────────────────────────────
Resources:

  # ── DynamoDB: Inventory Table ──────────────────────────────────────────────
  OmniShelfInventory:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OmniShelfInventory-${Environment}"
      BillingMode: PAY_PER_REQUEST          # No capacity planning needed
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true                    # Encryption at rest
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: expiryDate
          AttributeType: S
        - AttributeName: sku
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        # GSI for FEFO queries — scan sorted by expiryDate
        - IndexName: ExpiryIndex
          KeySchema:
            - AttributeName: expiryDate
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # GSI for SKU-level lookups
        - IndexName: SkuIndex
          KeySchema:
            - AttributeName: sku
              KeyType: HASH
            - AttributeName: expiryDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true                       # Allow soft-delete via TTL
      Tags:
        - Key: Project
          Value: OmniShelf
        - Key: Environment
          Value: !Ref Environment

  # ── DynamoDB: Audit Table ─────────────────────────────────────────────────
  OmniShelfAudit:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OmniShelfAudit-${Environment}"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: auditId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: auditId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TimestampIndex
          KeySchema:
            - AttributeName: timestamp
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: OmniShelf
        - Key: Environment
          Value: !Ref Environment

  # ── SNS Topic: Expiry Alerts ──────────────────────────────────────────────
  ExpiryAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "OmniShelfExpiryAlerts-${Environment}"
      DisplayName: OmniShelf Expiry Alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmailAddress
      Tags:
        - Key: Project
          Value: OmniShelf

  # ── IAM: Shared Lambda Execution Role ────────────────────────────────────
  OmniShelfLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OmniShelfLambdaRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # DynamoDB: Full access to OmniShelf tables only
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt OmniShelfInventory.Arn
                  - !Sub "${OmniShelfInventory.Arn}/index/*"
                  - !GetAtt OmniShelfAudit.Arn
                  - !Sub "${OmniShelfAudit.Arn}/index/*"

        # Textract: Detect document text (no S3 — inline bytes only)
        - PolicyName: TextractAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - textract:DetectDocumentText
                Resource: "*"

        # Bedrock: Invoke Claude and Titan models
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-text-express-v1"

        # SNS: Publish to the alert topic only
        - PolicyName: SNSPublishAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ExpiryAlertTopic

        # CloudWatch Logs
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  # ── Lambda: OCR Service ───────────────────────────────────────────────────
  OcrServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OmniShelf-OcrService-${Environment}"
      CodeUri: ../backend/lambdas/ocrService/
      Handler: handler.handler
      Role: !GetAtt OmniShelfLambdaRole.Arn
      Description: Accepts base64 product images; runs Textract + Bedrock AI extraction
      MemorySize: 1024           # Higher memory for Textract response parsing
      Timeout: 60                # Textract + Bedrock can be slow
      Environment:
        Variables:
          BEDROCK_MODEL_ID:         !Ref BedrockModelId
          FALLBACK_MODEL_ID:        !Ref BedrockFallbackModelId
          BEDROCK_MAX_TOKENS:       "512"
      Events:
        OcrApi:
          Type: Api
          Properties:
            RestApiId: !Ref OmniShelfApi
            Path: /ocr
            Method: POST
        OcrOptions:
          Type: Api
          Properties:
            RestApiId: !Ref OmniShelfApi
            Path: /ocr
            Method: OPTIONS

  # ── Lambda: Inventory Service ────────────────────────────────────────────
  InventoryServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OmniShelf-InventoryService-${Environment}"
      CodeUri: ../backend/lambdas/inventoryService/
      Handler: handler.handler
      Role: !GetAtt OmniShelfLambdaRole.Arn
      Description: CRUD operations for inventory; FEFO-sorted GET, upsert POST, atomic dispatch
      Events:
        GetInventory:
          Type: Api
          Properties:
            RestApiId: !Ref OmniShelfApi
            Path: /inventory
            Method: GET
        PostInventory:
          Type: Api
          Properties:
            RestApiId: !Ref OmniShelfApi
            Path: /inventory
            Method: POST
        PostDispatch:
          Type: Api
          Properties:
            RestApiId: !Ref OmniShelfApi
            Path: /dispatch
            Method: POST
        InventoryOptions:
          Type: Api
          Properties:
            RestApiId: !Ref OmniShelfApi
            Path: /inventory
            Method: OPTIONS
        DispatchOptions:
          Type: Api
          Properties:
            RestApiId: !Ref OmniShelfApi
            Path: /dispatch
            Method: OPTIONS

  # ── Lambda: Alert Service ────────────────────────────────────────────────
  AlertServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OmniShelf-AlertService-${Environment}"
      CodeUri: ../backend/lambdas/alertService/
      Handler: handler.handler
      Role: !GetAtt OmniShelfLambdaRole.Arn
      Description: Daily scheduled scan for expiring items; sends SNS alerts
      MemorySize: 256
      Timeout: 120              # Large inventories need extra time to scan
      Environment:
        Variables:
          ALERT_THRESHOLD_DAYS: !Ref AlertThresholdDays
      Events:
        DailyAlertSchedule:
          Type: Schedule
          Properties:
            Name: !Sub "OmniShelf-DailyAlert-${Environment}"
            Description: Daily expiry alert scan — runs at 07:00 UTC
            Schedule: cron(0 7 * * ? *)     # 07:00 UTC daily
            Enabled: true

  # ── API Gateway ───────────────────────────────────────────────────────────
  OmniShelfApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "OmniShelf-API-${Environment}"
      StageName: !Ref Environment
      Description: OmniShelf REST API — OCR, Inventory, Dispatch
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true         # X-Ray tracing
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin:  "'*'"
        MaxAge:       "'86400'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            gatewayresponse.header.Access-Control-Allow-Origin:  "'*'"
            gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            gatewayresponse.header.Access-Control-Allow-Origin:  "'*'"
            gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod:   "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit:  50
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      Tags:
        Project:     OmniShelf
        Environment: !Ref Environment

  # ── CloudWatch Log Groups ─────────────────────────────────────────────────
  OcrServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/OmniShelf-OcrService-${Environment}"
      RetentionInDays: 30

  InventoryServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/OmniShelf-InventoryService-${Environment}"
      RetentionInDays: 30

  AlertServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/OmniShelf-AlertService-${Environment}"
      RetentionInDays: 30

# ────────────────────────────────────────────────────────────────────────────
# Outputs
# ────────────────────────────────────────────────────────────────────────────
Outputs:
  ApiBaseUrl:
    Description: Base URL of the OmniShelf REST API
    Value: !Sub "https://${OmniShelfApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "OmniShelf-ApiBaseUrl-${Environment}"

  OcrEndpoint:
    Description: OCR + AI extraction endpoint
    Value: !Sub "https://${OmniShelfApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/ocr"

  InventoryEndpoint:
    Description: Inventory CRUD endpoint
    Value: !Sub "https://${OmniShelfApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/inventory"

  DispatchEndpoint:
    Description: Stock dispatch endpoint
    Value: !Sub "https://${OmniShelfApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/dispatch"

  InventoryTableName:
    Description: DynamoDB Inventory table name
    Value: !Ref OmniShelfInventory
    Export:
      Name: !Sub "OmniShelf-InventoryTable-${Environment}"

  AuditTableName:
    Description: DynamoDB Audit table name
    Value: !Ref OmniShelfAudit
    Export:
      Name: !Sub "OmniShelf-AuditTable-${Environment}"

  AlertTopicArn:
    Description: SNS topic ARN for expiry alerts
    Value: !Ref ExpiryAlertTopic
    Export:
      Name: !Sub "OmniShelf-AlertTopicArn-${Environment}"

  LambdaRoleArn:
    Description: IAM role ARN shared by all OmniShelf Lambdas
    Value: !GetAtt OmniShelfLambdaRole.Arn
