# AWS SAM deployment configuration
# Usage: sam deploy  (uses values here, no interactive prompts)
version = 0.1

[default]
[default.global.parameters]
stack_name = "omnishelf-stack"

[default.build.parameters]
cached      = true
parallel    = true

[default.deploy.parameters]
capabilities           = "CAPABILITY_NAMED_IAM"
confirm_changeset      = true
resolve_s3             = true
region                 = "us-east-1"
parameter_overrides    = [
  "Environment=dev",
  "AlertEmailAddress=manager@example.com",
  "AlertThresholdDays=7",
  "StoreName=OmniShelf Store"
]
